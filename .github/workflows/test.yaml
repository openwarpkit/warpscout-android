name: test

on:
  push:
    branches: [master, main]
    paths-ignore: ["**.md", "LICENSE*", ".github/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...
