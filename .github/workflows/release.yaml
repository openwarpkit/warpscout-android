name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BIN=warpscout
          [ "$GOOS" = windows ] && BIN=warpscout.exe
          go build -trimpath -ldflags="-s -w -X github.com/vernette/warpscout/internal/warpscout.version=${GITHUB_REF_NAME#v}" -o "$BIN" .
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Compress (linux only)
        if: matrix.goos == 'linux'
        run: upx --best --lzma "$BIN"

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="warpscout_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = windows ]; then
            zip "$NAME.zip" "$BIN"; echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$BIN"; echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout writes a lightweight tag over the pushed one, which has no
          # body at all - refetch to get the annotated object back.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          NOTE=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          {
            [ -n "$NOTE" ] && printf '%s\n\n' "$NOTE"
            echo "## Commits"
            echo
            git -P log --no-merges \
              -E --invert-grep --grep='^docs(\(.*\))?:' \
              --pretty="- %s ([\`%h\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" \
              "$RANGE"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" ${PREV:+-f previous_tag_name="$PREV"} \
              --jq .body | sed -n '/^## New Contributors/,$p'
          } > body.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: body.md
