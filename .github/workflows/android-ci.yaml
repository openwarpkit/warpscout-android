name: android-ci

on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch recorded upstream tag
        run: |
          git remote add upstream https://github.com/vernette/warpscout.git
          UPSTREAM_TAG=$(sed -n 's/^- Upstream tag: `\([^`]*\)`.*/\1/p' UPSTREAM.md)
          git fetch --no-tags upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
      - name: Go tests and CLI regression tests
        run: |
          node scripts/check-upstream-sync.mjs
          go test ./...
      - name: Build CLI
        run: go build -trimpath ./
      - name: Verify synchronized upstream head
        if: startsWith(github.head_ref, 'chore/sync-upstream-')
        run: |
          git fetch --no-tags upstream master
          node scripts/check-upstream-sync.mjs --require-ref upstream/master

  mobile-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-26" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Build Go Mobile AAR
        run: ./scripts/build-mobile.sh
      - uses: actions/upload-artifact@v4
        with:
          name: warpscout-aar
          path: android/app/libs/warpscout.aar

  android:
    needs: mobile-aar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: warpscout-aar
          path: android/app/libs
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-26" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Unit tests, lint, Room schema, and debug APK
        run: bash android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Validate Room schema
        run: test -s android/app/schemas/io.github.openwarpkit.warpscout.data.WarpScoutDatabase/1.json
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: android/app/build/outputs/apk/debug/*.apk

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: |
            adb install "$(find "$GITHUB_WORKSPACE/apks" -name '*universal-debug.apk' -print -quit)"
            adb shell am start -W -n io.github.openwarpkit.warpscout.debug/io.github.openwarpkit.warpscout.MainActivity
            adb shell pidof io.github.openwarpkit.warpscout.debug

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-readme.mjs
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            README.md
            README_EN.md
            UPSTREAM.md
            THIRD_PARTY_NOTICES.md
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path go.sum README.md README_EN.md UPSTREAM.md THIRD_PARTY_NOTICES.md
